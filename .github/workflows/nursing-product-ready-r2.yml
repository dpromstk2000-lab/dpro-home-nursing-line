name: NURSING Product READY R2 QA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nursing-product-ready-r2.yml'
      - '.github/scripts/nursing-r2-qa.mjs'

permissions:
  contents: read

jobs:
  fresh-runtime-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_NO_WARNINGS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run NURSING R2 QA
        run: node .github/scripts/nursing-r2-qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nursing-r2-qa
          path: nursing-r2-qa-output/
          if-no-files-found: warn
          retention-days: 14
